name: Auth Service Deployment

on:
  workflow_dispatch:

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Setup docker buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push to hub
        run: |
          docker build -t gobigagency/auth-service:latest .
          docker push gobigagency/auth-service:latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Auth Service Container
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            docker pull gobigagency/auth-service:main

            docker stop auth_service || true
            docker rm auth_service || true

            docker run -d \
              --name auth_service \
              --restart always \
              -p 8001:8000 \
              gobigagency/auth-service:main